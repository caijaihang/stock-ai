name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build WPF App & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore StockAutoTrader.sln

      - name: Run unit tests
        run: dotnet test tests/StockAutoTrader.Tests/StockAutoTrader.Tests.csproj -c Release

      - name: Build (Release)
        run: dotnet build StockAutoTrader.sln -c Release

      - name: Publish single-file WPF executable
        run: >
          dotnet publish src/StockAutoTrader.App/StockAutoTrader.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o ./dist/StockAutoTrader-windows-x64

      - name: Create release artifact (zip)
        run: |
          Compress-Archive -Path "./dist/StockAutoTrader-windows-x64/*" -DestinationPath "StockAutoTrader-windows-x64.zip" -Force
          Write-Host "Built artifact for tag: ${{ github.ref_name }}"

      # 只在 tag 推送时创建 GitHub Release（仓库公开后可正常创建）
      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StockAutoTrader-windows-x64.zip
          tag_name: ${{ github.ref_name }}
          name: "StockAutoTrader ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## 自动构建产物

            - 平台：Windows x64
            - 格式：单文件 self-contained exe
            - 构建方式：GitHub Actions `build-release.yml`

            解压后直接运行 `StockAutoTrader.App.exe`。
