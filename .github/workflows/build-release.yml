name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build WPF App & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore StockAutoTrader.sln

      - name: Run unit tests
        run: dotnet test tests/StockAutoTrader.Tests/StockAutoTrader.Tests.csproj -c Release --logger "trx;LogFileName=test.trx"

      - name: Build (Release)
        run: dotnet build StockAutoTrader.sln -c Release

      - name: Publish single-file WPF executable
        run: >
          dotnet publish src/StockAutoTrader.App/StockAutoTrader.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o ./dist/StockAutoTrader-windows-x64

      - name: Create release artifact (zip)
        run: |
          $version = "${{ github.ref_name }}"
          if ("${{ github.ref }}" -notlike "refs/tags/*") {
            $version = "dev-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          }
          Compress-Archive -Path "./dist/StockAutoTrader-windows-x64/*" -DestinationPath "StockAutoTrader-windows-x64.zip" -Force
          Write-Host "Built artifact for version: $version"

      # 只在 tag 推送时上传 GitHub Release（避免 403 权限不足）
      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StockAutoTrader-windows-x64.zip
          tag_name: ${{ github.ref_name }}
          name: "StockAutoTrader ${{ github.ref_name }}"
          generate_release_notes: true

      # 仅在 tag 推送或手动触发时上传 artifact（避免存储配额 403）
      - name: Upload build artifact (tag / manual only)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: StockAutoTrader-windows-x64
          path: ./StockAutoTrader-windows-x64.zip
