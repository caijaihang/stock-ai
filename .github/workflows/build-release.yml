name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build WPF App & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore src/StockAutoTrader.App/StockAutoTrader.App.csproj

      - name: Run unit tests
        run: dotnet test tests/StockAutoTrader.Tests/StockAutoTrader.Tests.csproj -c Release

      - name: Build (Release)
        run: dotnet build src/StockAutoTrader.App/StockAutoTrader.App.csproj -c Release

      - name: Publish single-file WPF executable
        run: >
          dotnet publish src/StockAutoTrader.App/StockAutoTrader.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o ./dist/StockAutoTrader-windows-x64

      - name: Create release artifact (zip)
        run: |
          Compress-Archive -Path "./dist/StockAutoTrader-windows-x64/*" -DestinationPath "StockAutoTrader-windows-x64.zip" -Force
          Write-Host "Built artifact for ref: ${{ github.ref_name }}"

      # 生成版本号：v年月日.时分（每次推送唯一）
      - name: Generate version
        id: gen-version
        run: |
          $version = "v" + (Get-Date -Format "yyyy.MM.dd.HHmm")
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      # 每次 push 到 main 都用新版本号发布到 Release
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StockAutoTrader-windows-x64.zip
          tag_name: ${{ steps.gen-version.outputs.version }}
          name: "StockAutoTrader ${{ steps.gen-version.outputs.version }}"
          generate_release_notes: false
          draft: false
          body: |
            ## 自动构建产物

            - 版本：${{ steps.gen-version.outputs.version }}
            - 平台：Windows x64（便携版，数据全部存到解压目录）
            - 格式：单文件 self-contained exe
            - 行情：支持通达信 .day 文件 / CSV 导出、同花顺 CSV 导出
            - 交易：支持 Simulated（模拟撮合）/ Real（文件桥接真实交易）
            - 构建提交：${{ github.sha }}
            - 构建时间：${{ github.event.head_commit.timestamp }}

            解压后直接运行 `StockAutoTrader.App.exe`。
